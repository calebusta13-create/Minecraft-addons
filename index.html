
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Addons</title>
<style>
body {
  margin: 0;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  padding: 45px 15px;
  background: #172b25;
}
h1 { font-size: 32px; }
main {
  max-width: 600px;
  margin: 45px auto;
  padding: 20px;
}
.card {
  background: #1f2937;
  padding: 25px;
  border-radius: 15px;
}
.tag { color: #86efac; }
footer {
  color: #9ca3af;
  padding: 30px;
}
</style>
</head>
<body>
<header>
  <h1>⛏ Minecraft Addons</h1>
  <p>Discover something new in Minecraft.</p>
</header>
<main>
  <div class="card">
    <p class="tag">OUR FIRST RELEASE</p>
    <h2>Coming Soon!</h2>
    <p>Our first Minecraft Bedrock addon is currently in development.</p>
    <p>Stay tuned for the release!</p>
  </div>
</main>
<footer>
  Made for the Minecraft Bedrock community.
</footer>
</body>
</html>
